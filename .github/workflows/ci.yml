name: CI - AI Engine & Frontend Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Garante compatibilidade caso actions do runner ainda utilizem runtime Node 20
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  # 1. Validação da Engine de IA e Scripts Python
  python-ai-tests:
    name: Python AI & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile *.py ai/*.py scripts/*.py

      - name: Run ISMCTS Engine Dry-Run (Local Simulation)
        run: |
          python scripts/analyze_ismcts.py --dry-run

      - name: Check Template Synchronization
        run: |
          python scripts/prepare_environment.py --export-templates
          git diff --exit-code setup_templates/ || (echo "ERRO: setup_templates/ está desatualizado! Execute ./scripts/sync_and_clean.sh localmente." && exit 1)

  # 2. Validação de Compilação do Frontend Vite
  frontend-build:
    name: Talishar Frontend (Vite) Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare Talishar Frontend & Apply Custom Templates
        run: |
          python scripts/prepare_environment.py --frontend-only

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Talishar-FE/package-lock.json'

      - name: Install NPM Packages & Build
        run: |
          cd Talishar-FE
          npm ci || npm install
          npx vite build
